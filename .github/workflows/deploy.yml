# Deploys to an existing Vercel project with the Vercel CLI.
# Pushes to main → production. Pull requests → preview URL posted as a PR comment.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       required  vercel.com/account/tokens
#   VERCEL_PROJECT_ID  required  Vercel → Project → Settings → General → "Project ID" (the project name also works)
#   VERCEL_ORG_ID      optional  looked up from the project via the Vercel API when not set
name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs don't get secrets; skip instead of failing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Vercel project and org
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          [ -n "$VERCEL_TOKEN" ] || { echo "::error::Missing repository secret VERCEL_TOKEN"; exit 1; }
          [ -n "$PROJECT" ] || { echo "::error::Missing repository secret VERCEL_PROJECT_ID"; exit 1; }
          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }

          # Try the personal account first, then every team the token can see.
          json=""
          if [ -n "$ORG" ] && [[ "$ORG" == team_* ]]; then
            json=$(api "/v9/projects/$PROJECT?teamId=$ORG" || true)
          fi
          [ -n "$json" ] || json=$(api "/v9/projects/$PROJECT" || true)
          if [ -z "$json" ]; then
            for team in $(api "/v2/teams" | jq -r '.teams[].id'); do
              json=$(api "/v9/projects/$PROJECT?teamId=$team" || true)
              [ -n "$json" ] && break
            done
          fi
          if [ -z "$json" ]; then
            echo "::error::Project '$PROJECT' not found with this token. Check VERCEL_PROJECT_ID and that the token's scope includes the team that owns the project."
            exit 1
          fi

          echo "VERCEL_PROJECT_ID=$(jq -r .id <<<"$json")" >> "$GITHUB_ENV"
          echo "VERCEL_ORG_ID=$(jq -r .accountId <<<"$json")" >> "$GITHUB_ENV"
          echo "Deploying to Vercel project: $(jq -r .name <<<"$json")"

      - name: Install Vercel CLI
        run: npm install --global vercel@64

      - name: Set target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" -a "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"; echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"; echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview deployed: ${{ steps.deploy.outputs.url }}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('Preview deployed:'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
